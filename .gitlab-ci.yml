image: registry.gitlab.com/equalitie/ouinet:latest

stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build:
  stage: build
  tags:
    - docker
  script:
    - apt install -y
        libboost-chrono-dev 
        libboost-date-time-dev 
        libboost-filesystem-dev 
        libboost-program-options-dev 
        libboost-system-dev 
        libboost-thread-dev
    - cmake -S ./build -B cmake-build -DWITH_BINARY=OFF -WITH_GUI=OFF
    - cmake --build cmake-build
